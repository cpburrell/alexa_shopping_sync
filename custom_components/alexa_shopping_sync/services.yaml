force_refresh:
  name: Force Refresh
  description: Force an immediate sync cycle
  fields:
    config_entry_id:
      name: Config Entry
      description: Limit to one config entry. Applies to all entries if omitted.
      required: false
      selector:
        config_entry:
          integration: alexa_shopping_sync

full_resync:
  name: Full Resync
  description: Clear all mappings and perform a full resync from scratch
  fields:
    config_entry_id:
      name: Config Entry
      description: Limit to one config entry. Applies to all entries if omitted.
      required: false
      selector:
        config_entry:
          integration: alexa_shopping_sync

clear_local_mapping:
  name: Clear Local Mapping
  description: Clear the local item mapping store without triggering a resync
  fields:
    config_entry_id:
      name: Config Entry
      description: Limit to one config entry. Applies to all entries if omitted.
      required: false
      selector:
        config_entry:
          integration: alexa_shopping_sync

mark_reauth_needed:
  name: Mark Re-auth Needed
  description: Manually mark the session as expired and trigger re-authentication
  fields:
    config_entry_id:
      name: Config Entry
      description: Limit to one config entry. Applies to all entries if omitted.
      required: false
      selector:
        config_entry:
          integration: alexa_shopping_sync

export_sanitized_diagnostics:
  name: Export Sanitized Diagnostics
  description: Export diagnostics data with all secrets removed
  fields:
    config_entry_id:
      name: Config Entry
      description: Limit to one config entry. Applies to all entries if omitted.
      required: false
      selector:
        config_entry:
          integration: alexa_shopping_sync
